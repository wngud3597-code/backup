{% extends "base.html" %}

{% block content %}
  <h1>로그인 페이지</h1>
  <form action="{% url 'accounts:login' %}" method="POST">
    {% csrf_token %}
    <input type="text" name="username" placeholder="유저네임">
    <input type="password" name="password" placeholder="비밀번호">
    <input type="submit" value="로그인">
  </form>
{% endblock content %}
