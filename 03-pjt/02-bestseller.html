<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ThRead - Bestseller</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />

    <style>
      /* 폰트 정의 */

      @font-face {
        font-family: "SBAggro_L";
        src: url("assets/fonts/SBAggroOTF_L.ttf") format("ttf");
      }
      @font-face {
        font-family: "GmarketSansTTFMedium";
        src: url("assets/fonts/GmarketSansTTFMedium.ttf") format("ttf");
      }

      body {
        margin: 0;
        padding: 0;
        color: #333;
        font-family: "Helvetica Neue", Arial, sans-serif;
      }
      /* 요구사항의 이미지크기를 맟춰서 정확한 픽셀값을 사용하였음 */

      .book-item {
        width: 150px;
      }

      .book-cover {
        width: 150px;
        height: 220px;
        object-fit: cover;
      }
      /* carousel이 오른쪽 남은 공간에 맟춰 줄어들도록 min-width를 0으로 지정 또한 next버튼이 책가리지않도록함 */

      .bestseller-carousel {
        min-width: 0;
        padding-right: 3rem;
      }
      /* Next 버튼의 너비도 확보한 공간과 동일하게 맞춥니다. 기본 아이콘은 흰색이므로, 밝은 배경에서도 보이도록 색상을 반전합니다. */
      .bestseller-carousel .carousel-control-next {
        width: 3rem;
      }

      .bestseller-carousel .carousel-control-next-icon {
        filter: invert(1);
      }
      .bestseller-container {
        max-width: 1000px;
      }
    </style>
  </head>
  <body>
    <!-- 베스트셀러 섹션 -->
    <!-- 요구사항속 좌측제목, 우측 도서리스트를 구현하였음 -->
    <section class="bestseller py-5">
      <div
        class="container-fluid bestseller-container d-flex align-items-center gap-4"
      >
        <h3 class="section-title mb-0 flex-shrink-0 fw-bold">베스트셀러</h3>
        <!-- 
          [과제 안내]
          아래 영역에 Bootstrap Carousel 컴포넌트를 이용해
          - 총 12권의 도서를 4권씩 나눈 슬라이드를 구현하고,
          - 각 도서는 도서 커버 이미지와 제목으로 구성하며,
          - 우측에만 표시되는 Next 컨트롤 버튼을 포함하도록 작성하세요.
        -->
        <!-- 코드는 여기에 작성하시오 -->
        <!-- 슬라이드 구현 코드 -->
        <div
          id="bestsellerCarousel"
          class="carousel slide bestseller-carousel flex-grow-1"
          data-bs-ride="carousel"
          data-bs-wrap="true"
        >
          <div class="carousel-inner">
            <div class="carousel-item active">
              <div class="d-flex flex-wrap justify-content-center gap-4">
                <div class="book-item text-center flex-shrink-0">
                  <img
                    src="assets/bestsellers/img1.jpeg"
                    alt="소년이 온다"
                    class="book-cover d-block mx-auto"
                  />
                  <p class="mt-2 mb-0 small text-secondary">소년이 온다</p>
                </div>

                <div class="book-item text-center flex-shrink-0">
                  <img
                    src="assets/bestsellers/img2.jpeg"
                    alt="채식주의자"
                    class="book-cover d-block mx-auto"
                  />
                  <p class="mt-2 mb-0 small text-secondary">채식주의자</p>
                </div>

                <div class="book-item text-center flex-shrink-0">
                  <img
                    src="assets/bestsellers/img3.jpeg"
                    alt="대온실 수리 보고서"
                    class="book-cover d-block mx-auto"
                  />
                  <p class="mt-2 mb-0 small text-secondary">
                    대온실 수리 보고서
                  </p>
                </div>

                <div class="book-item text-center flex-shrink-0">
                  <img
                    src="assets/bestsellers/img4.jpeg"
                    alt="급류"
                    class="book-cover d-block mx-auto"
                  />
                  <p class="mt-2 mb-0 small text-secondary">급류</p>
                </div>
              </div>
            </div>

            <div class="carousel-item">
              <div class="d-flex flex-wrap justify-content-center gap-4">
                <div class="book-item text-center flex-shrink-0">
                  <img
                    src="assets/bestsellers/img5.jpeg"
                    alt="시간의 계곡"
                    class="book-cover d-block mx-auto"
                  />
                  <p class="mt-2 mb-0 small text-secondary">시간의 계곡</p>
                </div>

                <div class="book-item text-center flex-shrink-0">
                  <img
                    src="assets/bestsellers/img6.jpeg"
                    alt="인간 실격"
                    class="book-cover d-block mx-auto"
                  />
                  <p class="mt-2 mb-0 small text-secondary">인간 실격</p>
                </div>

                <div class="book-item text-center flex-shrink-0">
                  <img
                    src="assets/bestsellers/img7.jpeg"
                    alt="노르웨이의 숲"
                    class="book-cover d-block mx-auto"
                  />
                  <p class="mt-2 mb-0 small text-secondary">노르웨이의 숲</p>
                </div>

                <div class="book-item text-center flex-shrink-0">
                  <img
                    src="assets/bestsellers/img8.jpeg"
                    alt="정원에 뱀이"
                    class="book-cover d-block mx-auto"
                  />
                  <p class="mt-2 mb-0 small text-secondary">정원에 뱀이</p>
                </div>
              </div>
            </div>
            <div class="carousel-item">
              <div class="d-flex flex-wrap justify-content-center gap-4">
                <div class="book-item text-center flex-shrink-0">
                  <img
                    src="assets/bestsellers/img9.jpeg"
                    alt="네 칼이 센가, 내 칼이 센가."
                    class="book-cover d-block mx-auto"
                  />
                  <p class="mt-2 mb-0 small text-secondary">
                    네 칼이 센가, 내 칼이 센가.
                  </p>
                </div>

                <div class="book-item text-center flex-shrink-0">
                  <img
                    src="assets/bestsellers/img10.jpeg"
                    alt="새벽의 사원"
                    class="book-cover d-block mx-auto"
                  />
                  <p class="mt-2 mb-0 small text-secondary">새벽의 사원</p>
                </div>

                <div class="book-item text-center flex-shrink-0">
                  <img
                    src="assets/bestsellers/img11.jpeg"
                    alt="위싱머신"
                    class="book-cover d-block mx-auto"
                  />
                  <p class="mt-2 mb-0 small text-secondary">위싱머신</p>
                </div>

                <div class="book-item text-center flex-shrink-0">
                  <img
                    src="assets/bestsellers/img12.jpeg"
                    alt="모순"
                    class="book-cover d-block mx-auto"
                  />
                  <p class="mt-2 mb-0 small text-secondary">모순</p>
                </div>
              </div>
            </div>
          </div>
          <!-- Next 버튼 입력 위치 -->
          <button
            class="carousel-control-next"
            type="button"
            data-bs-target="#bestsellerCarousel"
            data-bs-slide="next"
          >
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">다음 도서 목록</span>
          </button>
        </div>
      </div>
    </section>

    <!-- Bootstrap JS -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
