<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ThRead - AI recommendation</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <style>
      /* 폰트 정의 */
      @font-face {
        font-family: "SBAggroOTF_L";
        src: url("assets/fonts/SBAggroOTF_L.ttf") format("truetype");
      }
      @font-face {
        font-family: "GmarketSansTTFMedium";
        src: url("assets/fonts/GmarketSansTTFMedium.ttf") format("truetype");
      }
      body {
        margin: 0;
        padding: 0;
        color: #333;
        font-family: "Helvetica Neue", Arial, sans-serif;
      }
      .ai-recommendation {
        width: 80%;
        margin: 0 auto;
      }
      .section-title {
        font-family: "GmarketSansTTFMedium", sans-serif;
        font-size: 1.4rem;
        font-weight: 700;
        margin: 0;
      }

      /* 도서 이미지: 가운데 책이 가장 크게 */
      .book-img {
        object-fit: cover;
      }
      .book-img.side {
        width: 120px;
        height: 180px;
      }
      .book-img.center {
        width: 140px;
        height: 210px;
      }

      /* 서비스 소개 텍스트 */
      .ai-text p {
        font-family: "SBAggroOTF_L", sans-serif;
      }

      /* "활동 데이터 기반" 강조 */
      .highlight {
        color: #fe4a51;
        font-family: "SBAggroOTF_L", sans-serif;
        font-size: 1.3rem;
      }
    </style>
  </head>
  <body>
    <!-- AI 추천 섹션 -->
    <section class="py-5">
      <div class="ai-recommendation">
        <!-- Grid: 7:5, 수직 중앙 정렬 (768px 미만에서는 위아래로 쌓임) -->
        <div class="row align-items-center g-4">
          <!-- 좌측: 도서 이미지 영역 -->
          <div class="col-12 col-md-7">
            <div
              class="d-flex flex-column flex-md-row align-items-center justify-content-center gap-3"
            >
              <img
                src="assets/ai_recommendation/img1.jpeg"
                alt="Bauhaus"
                class="book-img side"
              />
              <img
                src="assets/ai_recommendation/img2.jpeg"
                alt="Mastering AI"
                class="book-img center"
              />
              <img
                src="assets/ai_recommendation/img3.jpeg"
                alt="Design"
                class="book-img side"
              />
            </div>
          </div>

          <!-- 우측: 서비스 소개 텍스트 영역 -->
          <div class="col-12 col-md-5 ai-text">
            <h3 class="mb-3 section-title">AI 추천</h3>
            <p class="text-muted">구매 목록, 감명 깊게 읽은 도서 등</p>
            <p class="text-muted">
              사용자의 <span class="highlight">활동 데이터 기반</span> 인공지능
              도서 추천
            </p>
          </div>
        </div>
      </div>
    </section>

    <!-- Bootstrap JS -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
