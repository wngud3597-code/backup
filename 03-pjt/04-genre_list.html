<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ThRead - Genre</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />

    <style>
      /* 폰트 정의 */
      @font-face {
        font-family: "SBAggro_L";
        src: url("assets/fonts/SBAggroOTF_L.ttf") format("truetype");
      }
      @font-face {
        font-family: "GmarketSansTTFMedium";
        src: url("assets/fonts/GmarketSansTTFMedium.ttf") format("truetype");
      }

      /* 섹션: 폭 80% + 중앙 정렬 */
      .genre-books {
        width: 80%;
        margin: 0 auto;
        padding: 3rem 0;
      }
      .genre-books .section-title {
        font-family: "GmarketSansTTFMedium", sans-serif;
        font-size: 1.5rem;
        text-align: center;
        margin-bottom: 2rem;
      }

      /* Flexbox 그리드 컨테이너: 기본 4열 (gap 1rem 기준) */
      .genre-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;
      }

      /* 아이템: 고정된 크기 유지 (flex 늘어남/줄어듦 없음) */
      .genre-item {
        position: relative;
        flex: 0 0 calc((100% - 3rem) / 4);
        height: 200px;
        overflow: hidden;
        border-radius: 0.5rem;
      }

      /* 이미지는 항상 부모 크기에 맞게 채움 */
      .genre-item img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      /* 좌측 하단 장르명 오버레이 */
      .genre-item .genre-name {
        position: absolute;
        left: 0;
        bottom: 0;
        padding: 0.5rem 0.75rem;
        color: #fff;
        font-family: "SBAggro_L", sans-serif;
        font-size: 0.95rem;
        text-shadow: 0 1px 4px rgba(0, 0, 0, 0.7);
      }

      /* 모바일(576px 미만): 폭 100%, 1열 */
      @media (max-width: 575.98px) {
        .genre-item {
          flex: 0 0 100%;
        }
      }
    </style>
  </head>
  <body>
    <section class="genre-books">
      <h3 class="section-title">장르별 도서 목록</h3>

      <div class="genre-grid">
        <div class="genre-item">
          <img src="assets/genre/travel.jpg" alt="여행" />
          <span class="genre-name">여행</span>
        </div>
        <div class="genre-item">
          <img src="assets/genre/health.jpg" alt="건강" />
          <span class="genre-name">건강</span>
        </div>
        <div class="genre-item">
          <img src="assets/genre/art.jpg" alt="예술" />
          <span class="genre-name">예술</span>
        </div>
        <div class="genre-item">
          <img src="assets/genre/history.jpg" alt="역사" />
          <span class="genre-name">역사</span>
        </div>
        <div class="genre-item">
          <img src="assets/genre/economy.jpg" alt="경제" />
          <span class="genre-name">경제</span>
        </div>
        <div class="genre-item">
          <img src="assets/genre/philosophy.jpg" alt="철학" />
          <span class="genre-name">철학</span>
        </div>
        <div class="genre-item">
          <img src="assets/genre/natural_science.jpg" alt="자연과학" />
          <span class="genre-name">자연과학</span>
        </div>
        <div class="genre-item">
          <img src="assets/genre/baby.jpg" alt="육아" />
          <span class="genre-name">육아</span>
        </div>
        <div class="genre-item">
          <img src="assets/genre/youth.jpg" alt="청소년" />
          <span class="genre-name">청소년</span>
        </div>
        <div class="genre-item">
          <img src="assets/genre/romance.jpg" alt="로맨스" />
          <span class="genre-name">로맨스</span>
        </div>
      </div>
    </section>

    <!-- Bootstrap JS -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
