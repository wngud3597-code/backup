<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 눈누에서 복사한 @font-face 가 들어 있는 CSS 파일 연결 -->
    <link rel="stylesheet" href="02_noonnu.css" />
    <title>눈누 폰트 예제</title>
  </head>

  <body>
    <!-- 비교용: class 가 없으므로 브라우저 기본 폰트로 표시 -->
    <h1>G마켓 산스 폰트가 적용되지 않은 글자입니다.</h1>
    <hr />
    <!-- class="gmarket-font" => CSS 의 .gmarket-font 규칙(GmarketSansMedium)이 적용됨 -->
    <h1 class="gmarket-font">G마켓 산스 폰트가 적용된 글자입니다.</h1>
  </body>
</html>
