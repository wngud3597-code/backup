<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Google Fonts 의 @import 가 들어 있는 CSS 파일 연결 -->
  <link rel="stylesheet" href="01_google_fonts.css">
  <title>Google Fonts 예제</title>
</head>

<body>
  <!-- 비교용: class 가 없으므로 브라우저 기본 폰트로 표시 -->
  <h1>구글 폰트가 적용되지 않은 글자입니다.</h1>
  <hr>
  <!-- class="google-font" => CSS 의 .google-font 규칙(Nanum Pen Script)이 적용됨 -->
  <h1 class="google-font">구글 폰트가 적용된 글자입니다.</h1>
</body>

</html>
